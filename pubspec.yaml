name: etailor
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Fonts
  google_fonts: ^6.2.1

  # Responsive layout
  flutter_screenutil: ^5.9.3

  # Images
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Formatting (currency, dates)
  intl: ^0.19.0

  # OTP input boxes
  pin_code_fields: ^8.0.1

  # Local persistence (login state, theme mode)
  shared_preferences: ^2.3.2

  # Loading skeletons
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/